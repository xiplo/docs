name: CI

on:
  push:
    branches: [main, "claude/*"]
    paths:
      - "instagram-generator/**"
  pull_request:
    branches: [main]
    paths:
      - "instagram-generator/**"

defaults:
  run:
    working-directory: instagram-generator

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt mypy
      - run: mypy --ignore-missing-imports .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov
      - name: Run tests
        run: pytest -v --tb=short --cov=. --cov-report=term-missing -m "not integration"
      - name: Check coverage
        run: pytest --cov=. --cov-fail-under=40 -m "not integration" -q

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t instagram-generator .
        working-directory: instagram-generator
